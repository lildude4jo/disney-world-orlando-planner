<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Disney World trip planner</title>
<!-- Created by Avinash -->
<meta name="theme-color" content="#17202B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="author" content="Avinash">
<meta name="apple-mobile-web-app-title" content="Disney Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  color-scheme:light dark;
  --ink:#17202B; --muted:#56616E; --paper:#F2F5F4; --card:#FFFFFF; --line:#D5DCDA;
  --chg:#8F4300; --chgbg:#FDEFD9; --ver:#1B45B8; --verbg:#E6EDFD;
  --add:#0B6B45; --addbg:#DDF3E8; --rem:#9B1239; --rembg:#FCE4EA; --call:#5B2A9E; --callbg:#EFE6FB;
  --onc:#fff;
}
.t-ak{--c:#1F7A4D}
.t-mk1{--c:#3347B8}
.t-mk2{--c:#A3306F}
.t-mk{--c:#3347B8}
.t-ep{--c:#0E7490}
.t-hs{--c:#B4233B}
.t-rest{--c:#475569}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#E9EFF1; --muted:#A5B0BA; --paper:#0F1518; --card:#182024; --line:#2B363B;
    --chg:#FFC27A; --chgbg:#3A2A12; --ver:#9DB7FF; --verbg:#1B2745;
    --add:#7BE0B1; --addbg:#12342A; --rem:#FF9DB5; --rembg:#3E1623; --call:#CDAEFF; --callbg:#2C1D47;
    --onc:#0B1210;
  }
  .t-ak{--c:#46C08A}
  .t-mk1{--c:#8C9DFF}
  .t-mk2{--c:#F083BA}
  .t-mk{--c:#8C9DFF}
  .t-ep{--c:#5CC8E0}
  .t-hs{--c:#FF8DA1}
  .t-rest{--c:#A8B3C2}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.45 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}

/* header */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:800;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-row>div:first-child{min-width:0;flex:1}
.count{font-size:13px;color:var(--muted)}
.share{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.days{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.top-btns{display:flex;gap:8px;flex-wrap:nowrap;justify-content:flex-end}
.top-btns .share{padding:5px 12px;font-size:14px;white-space:nowrap}
.day-btn{flex:1 0 86px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:8px 6px 9px;text-align:center;line-height:1.1}
.day-btn .dw{font-size:13px;color:var(--muted);font-weight:600}
.day-btn .dn{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;margin:2px 0 3px}
.day-btn .dp{font-size:12px;font-weight:600}
.day-btn[aria-pressed=true]{background:var(--c);border-color:var(--c);color:var(--onc)}
.day-btn[aria-pressed=true] .dw{color:inherit;opacity:.85}

main{padding:18px 16px 8px;max-width:640px;margin:0 auto}
h1{font-size:30px;line-height:1.05;letter-spacing:-.025em;margin:2px 0 4px;font-weight:800}
.sub{margin:0;color:var(--muted);font-weight:600}
.hours{margin:10px 0 0;font-weight:700;color:var(--c)}
.hours small{display:block;font-weight:500;color:var(--muted);font-size:13px}

.heads{margin:16px 0 22px;padding:12px 14px;list-style:none;border-left:5px solid var(--c);background:var(--card);border-radius:0 12px 12px 0}
.heads li+li{margin-top:8px}
.heads li{font-size:15px}

/* timeline */
.tl{list-style:none;margin:0 0 6px 10px;padding:0;border-left:3px solid var(--line)}
.blk{position:relative;padding:0 0 20px 20px}
.blk::before{content:"";position:absolute;left:-9.5px;top:3px;width:16px;height:16px;border-radius:50%;
  background:var(--paper);border:3px solid var(--muted)}
.blk.now::before{background:var(--c);border-color:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 25%,transparent)}
.blk.past::before{border-color:var(--line)}
.when{font-weight:800;font-size:15px;color:var(--c);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nowpill{background:var(--c);color:var(--onc);font-size:12px;padding:1px 9px;border-radius:999px}
.blk h2{margin:1px 0 4px;font-size:19px;letter-spacing:-.01em;font-weight:800}
.items{list-style:none;margin:0;padding:0}
.it{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it input,.it .x{flex:none;width:26px;height:26px;margin:1px 0 0}
.it input{-webkit-appearance:none;appearance:none;border:2px solid var(--muted);border-radius:8px;background:var(--card);display:grid;place-content:center}
.it input:checked{background:var(--c);border-color:var(--c)}
.it input:checked::after{content:"";width:6px;height:12px;border:solid var(--onc);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.it .x{display:grid;place-content:center;color:var(--rem);font-weight:800}
.it label{display:flex;gap:12px;flex:1;align-items:flex-start}
.tx{flex:1;min-width:0}
.ttl{font-weight:600}
.ico{margin-right:6px}
.it input:checked ~ .tx .ttl{text-decoration:line-through;color:var(--muted)}
.it.rm .ttl{text-decoration:line-through;color:var(--muted)}
.note{margin:3px 0 0;font-size:14px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.b-changed{background:var(--chgbg);color:var(--chg)}
.b-verify{background:var(--verbg);color:var(--ver)}
.b-added{background:var(--addbg);color:var(--add)}
.b-removed{background:var(--rembg);color:var(--rem)}
.b-call{background:var(--callbg);color:var(--call)}

.skip{margin:8px 0 0;padding:14px;border-radius:14px;background:var(--rembg)}
.skip h2{margin:0 0 6px;font-size:17px;color:var(--rem)}
.skip ul{margin:0;padding:0;list-style:none}
.skip li{padding:5px 0;font-size:15px}
.skip li b{font-weight:800}
.skip li.gone b{text-decoration:line-through}

/* notes & rules */
section.sec{margin:0 0 26px}
section.sec h2{font-size:22px;letter-spacing:-.02em;margin:0 0 4px;font-weight:800}
section.sec>p{margin:0 0 10px;color:var(--muted);font-size:15px}
.rows{list-style:none;margin:0;padding:0}
.rows>li{padding:11px 0;border-top:1px solid var(--line)}
.rows>li:first-child{border-top:0}
.rows b{display:block;font-weight:800}
.rows span{display:block;font-size:15px;color:var(--muted)}
.rows.chk>li{padding:0}
.rows.chk label{display:flex;gap:12px;align-items:flex-start;padding:11px 0}
.rows.chk input{-webkit-appearance:none;appearance:none;flex:none;width:26px;height:26px;border:2px solid var(--muted);border-radius:8px;background:var(--card);display:grid;place-content:center;margin:0}
.rows.chk input:checked{background:var(--c);border-color:var(--c)}
.rows.chk input:checked::after{content:"";width:6px;height:12px;border:solid var(--onc);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.rows.chk input:checked + span{text-decoration:line-through}
.rows.chk span{color:var(--ink);font-size:16px}
ol.how{margin:0;padding-left:20px}
ol.how li{margin:6px 0}
.fine{font-size:13px;color:var(--muted);margin-top:18px}


/* wait chips, alternates, buttons, inputs */
.wt{display:none;margin-left:6px;font-size:12px;font-weight:800;padding:1px 8px;border-radius:999px;vertical-align:1px;white-space:nowrap}
.wt.on{display:inline-block}
.w-low{background:var(--addbg);color:var(--add)}
.w-mid{background:var(--chgbg);color:var(--chg)}
.w-high{background:var(--rembg);color:var(--rem)}
.w-off{background:var(--line);color:var(--muted)}
.b-h{background:var(--line);color:var(--ink)}
details.more{margin:18px 0 6px;background:var(--card);border-radius:14px;padding:2px 14px}
details.more summary{font-weight:800;padding:12px 0;cursor:pointer}
.altlist{list-style:none;margin:0;padding:0}
.altlist li{padding:10px 0;border-top:1px solid var(--line)}
.altlist .note{margin-top:2px}
.alt-t{font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
.seg .btn[aria-pressed=true]{background:var(--c);border-color:var(--c);color:var(--onc)}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:12px;padding:11px 14px;font-weight:700}
.btn.pri{background:var(--c);border-color:var(--c);color:var(--onc)}
.btn.warn{border-color:var(--rem);color:var(--rem)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.inp{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin:6px 0 10px}
label.lbl{display:block;font-weight:700;font-size:14px;margin-top:6px}
.wrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow>span:first-child{color:var(--ink);font-size:16px}
.wrow small{display:block;color:var(--muted);font-size:13px}
.wrow .wt{display:inline-block;margin:0}
.mem{padding:12px 0;border-top:1px solid var(--line)}
.mem:first-child{border-top:0}
.mem b{font-weight:800}
.mem .meta{color:var(--muted);font-size:14px}
.mem.stale .meta{color:var(--rem)}
.mem a{color:var(--c);font-weight:700}
.stat{font-size:14px;color:var(--muted);margin:6px 0 0}
.err{background:var(--rembg);color:var(--rem);padding:10px 12px;border-radius:12px;font-size:14px;margin:10px 0}
pre.sql{white-space:pre-wrap;word-break:break-word;font:12px/1.4 ui-monospace,Menlo,monospace;background:var(--card);padding:10px;border-radius:10px;max-height:220px;overflow:auto}


/* map, walking and ordering notes */
.map{position:relative;isolation:isolate;height:min(58vh,460px);min-height:300px;border-radius:14px;overflow:hidden;background:var(--card);margin:10px 0}
.pin span{display:grid;place-content:center;width:28px;height:28px;border-radius:50%;background:var(--c);color:var(--onc);font:800 13px/1 ui-rounded,system-ui,sans-serif;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.legs{list-style:none;margin:0;padding:0}
.legs li{padding:10px 0;border-top:1px solid var(--line)}
.legs li:first-child{border-top:0}
.legs .meta{display:block;color:var(--muted);font-size:14px}
.walk{font-size:14px;color:var(--muted);margin:-10px 0 14px}
.whylist{margin:0;padding:0 0 12px 18px}
.whylist li{margin:8px 0;font-size:15px}
.b-moved{background:var(--chgbg);color:var(--chg)}


/* signature, reminders, filters */
.catlist .badge{display:inline-block;margin:2px 6px 2px 0}
.sig{margin:28px 0 6px;text-align:center;font-size:13px;color:var(--muted);letter-spacing:.02em}
.remind{background:var(--chgbg);color:var(--chg);border-radius:14px;padding:12px 14px;margin:0 0 16px}
.remind b{display:block;margin-bottom:6px}
.rline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;color:var(--ink)}
.rline .btn{padding:6px 12px;border-color:var(--chg);color:var(--chg)}
.rem{padding:10px 0;border-top:1px solid var(--line)}
.rem:first-child{border-top:0}
.remlab{display:flex;gap:12px;align-items:flex-start}
.remlab input{-webkit-appearance:none;appearance:none;flex:none;width:26px;height:26px;margin:1px 0 0;border:2px solid var(--muted);border-radius:8px;background:var(--card);display:grid;place-content:center}
.remlab input:checked{background:var(--c);border-color:var(--c)}
.remlab input:checked::after{content:"";width:6px;height:12px;border:solid var(--onc);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.rem.done .ttl{text-decoration:line-through;color:var(--muted)}
.rem small{display:block;color:var(--muted);font-size:13px}
.rbtns{display:flex;gap:18px;margin:4px 0 0 38px}
.linkbtn{border:0;background:transparent;color:var(--c);font-weight:700;padding:6px 0;text-decoration:underline}
.linkbtn:last-child{color:var(--rem)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chipbtn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.chipbtn[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.morebox{margin:14px 0 6px;background:var(--card);border-radius:14px;padding:12px 14px}
textarea.inp{resize:vertical;min-height:110px}


/* check-ins, meals and shopping */
.ckrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.pchip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-weight:700;font-size:14px;min-height:36px;color:var(--ink)}
.pchip[aria-pressed=true]{background:var(--c);border-color:var(--c);color:var(--onc)}
.also{display:block;width:100%;font-size:13px;color:var(--muted);font-weight:500}
.who{font-size:14px;color:var(--muted);margin:-6px 0 14px}
.who .linkbtn{padding:0 0 0 4px}
.meal{padding:12px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal .mt{display:block;font-weight:800;color:var(--c);font-size:14px}
.meal b{display:block;font-weight:800}
.meal p{margin:2px 0 0;font-size:15px;color:var(--muted)}
.shoprow{padding:9px 0;border-top:1px solid var(--line)}
.shoprow:first-child{border-top:0}
.shoprow small{display:block;color:var(--muted);font-size:13px}
.stepper{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:8px 0}
.stepper b{min-width:20px;text-align:center}
.stepper .btn{padding:4px 14px;font-size:18px}
.chipbtn.pn{display:inline-flex;gap:8px;align-items:center}
.xbtn{border:0;background:transparent;font-weight:800;color:var(--rem);padding:0 2px;font-size:14px}

.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
.seg3 .btn{padding:11px 6px;font-size:15px}
.seg3 .btn[aria-pressed=true]{background:var(--c);border-color:var(--c);color:var(--onc)}
h3.land{font-size:15px;color:var(--muted);margin:14px 0 2px;font-weight:700}

.snum{display:inline-grid;place-content:center;min-width:22px;height:22px;border-radius:50%;background:var(--c);color:var(--onc);font:800 12px/1 ui-rounded,system-ui,sans-serif;margin-right:6px;vertical-align:1px}
.approx{color:var(--muted);font-weight:700}


/* setup, forms and layout for the generic planner */
.setup{position:fixed;inset:0;z-index:40;background:var(--paper);overflow:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
.setup-in{max-width:560px;margin:0 auto}
.hint{font-size:13px;color:var(--muted);margin:-4px 0 6px}
.check{display:flex;gap:12px;align-items:center;margin:16px 0;font-weight:600}
.check input{width:24px;height:24px;flex:none}
select.inp{appearance:auto;-webkit-appearance:menulist}
.seg4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
.seg4 .btn{padding:11px 6px}
.seg4 .btn[aria-pressed=true]{background:var(--c);border-color:var(--c);color:var(--onc)}
.toast{z-index:60}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{border:0;background:transparent;padding:16px 1px;font-size:14px;font-weight:700;color:var(--muted);border-top:3px solid transparent}
.tab[aria-current=page]{color:var(--ink);border-top-color:var(--c)}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:9;
  opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body class="t-ak">
<header class="top">
  <div class="top-row">
    <div>
      <div class="brand" id="brand">Disney World trip</div>
      <div class="count" id="count"></div>
    </div>
    <div class="top-btns"><button class="share" id="setupbtn" type="button" aria-label="Trip setup">Setup</button><button class="share" id="share" type="button">Share</button></div>
  </div>
  <nav class="days" id="days" aria-label="Day"></nav>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs" aria-label="Sections">
  <button class="tab" data-tab="plan" type="button">Plan</button>
  <button class="tab" data-tab="map" type="button">Map</button>
  <button class="tab" data-tab="rides" type="button">Rides</button>
  <button class="tab" data-tab="group" type="button">Group</button>
  <button class="tab" data-tab="notes" type="button">Notes</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="setup" id="setup" hidden></div>

<script>
/* ---------- config ---------- */
// Optional: paste your Supabase project URL and publishable key here so every phone starts ready.
// You can also leave these empty and enter them in the Group tab instead.
const CONFIG={SUPABASE_URL:"",SUPABASE_KEY:""};
const API="https://api.themeparks.wiki/v1";
const LEAFLET="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/";
const WALK_MS=1.1, PATH_FACTOR=1.3;   // stroller pace in m/s; real paths run longer than straight lines
const KNOWLEDGE="Nov 6, 2026";        // when the park facts below were last checked

/* ---------- parks ---------- */
// open and close are typical hours. Real hours change by date, so each day can be edited.
const PARKS={
  mk:{label:"Magic Kingdom",short:"Magic Kingdom",id:"75ea578a-adc8-4116-a54d-dccb60765ef9",re:/magic kingdom/i,cls:"t-mk",open:"09:00",close:"21:00",gate:{lat:28.41620,lng:-81.58130},center:[28.4190,-81.5815,16]},
  ep:{label:"EPCOT",short:"EPCOT",id:"47f90d2c-e191-4239-a466-5892ef59a88b",re:/epcot/i,cls:"t-ep",open:"09:00",close:"21:00",gate:{lat:28.376550,lng:-81.549394},center:[28.3730,-81.5495,16]},
  hs:{label:"Hollywood Studios",short:"Hollywood Studios",id:"288747d1-8b4f-4a64-867e-ea7c9b27bad8",re:/hollywood studios/i,cls:"t-hs",open:"09:00",close:"21:00",gate:{lat:28.358442,lng:-81.558686},center:[28.3568,-81.5600,16]},
  ak:{label:"Animal Kingdom",short:"Animal Kingdom",id:"1c84a229-8862-4648-9c71-378ddd2c7693",re:/animal kingdom/i,cls:"t-ak",open:"08:00",close:"18:00",gate:{lat:28.355139,lng:-81.590069},center:[28.3590,-81.5905,16]}
};

/* ---------- every ride, show, walk-through and meet ---------- */
// [name, land, type, min height in, thrill 1-3, priority 1-3, minutes incl. an average line, position, wait-feed words, note, options]
// Positions: X = from a park GPS list (exact), E = estimated from the park layout (within roughly 50 m).
// Options: kid = fine for little ones even if thrill 2, ll = Lightning Lane type, c = [from, to, text] closed on those dates,
// x = closed for good, winter = often closed January to April, reserve = needs a booking, night = nighttime show, noauto = never scheduled.
const dms=(d,m,s)=>d+m/60+s/3600;
const X=(a,b)=>[dms(...a),-dms(...b),0];
const E=(lat,lng)=>[lat,lng,1];
const RAW={

function nowET(){
  const f=new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
  const p=Object.fromEntries(f.formatToParts(new Date()).map(x=>[x.type,x.value]));
  return {date:p.year+"-"+p.month+"-"+p.day,mins:(+p.hour)*60+(+p.minute)};
}
const mins=t=>{const [h,m]=t.split(":").map(Number);return h*60+m};
const hhmm=m=>{m=Math.max(0,Math.min(1439,Math.round(m)));return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
function fmt(t){const [h,m]=t.split(":").map(Number);const ap=h>=12?"PM":"AM";return ((h+11)%12+1)+":"+String(m).padStart(2,"0")+" "+ap}
function range(s,e){
  const a=fmt(s),b=fmt(e);
  return a.slice(-2)===b.slice(-2)?a.slice(0,-3)+" – "+b:a+" – "+b;
}

const SETUP_SQL=`create table if not exists public.locations(
  code text not null check (length(code) >= 20),
  member text not null check (length(member) between 1 and 40),
  lat double precision not null check (lat between -90 and 90),
  lng double precision not null check (lng between -180 and 180),
  acc real,
  updated_at timestamptz not null default now(),
  primary key (code, member)
);
alter table public.locations enable row level security;
revoke all on public.locations from anon, authenticated;

create or replace function public.share_location(p_code text, p_member text, p_lat double precision, p_lng double precision, p_acc real)
returns void language plpgsql security definer set search_path = public as $$
begin
  if length(p_code) < 20 then raise exception 'bad code'; end if;
  delete from public.locations where updated_at < now() - interval '12 hours';
  insert into public.locations(code, member, lat, lng, acc, updated_at)
  values (p_code, left(trim(p_member), 40), p_lat, p_lng, p_acc, now())
  on conflict (code, member) do update
    set lat = excluded.lat, lng = excluded.lng, acc = excluded.acc, updated_at = now();
end $$;

create or replace function public.get_locations(p_code text)
returns table(member text, lat double precision, lng double precision, acc real, updated_at timestamptz)
language sql security definer set search_path = public stable as $$
  select member, lat, lng, acc, updated_at from public.locations
  where code = p_code and length(p_code) >= 20 and updated_at > now() - interval '12 hours';
$$;

create or replace function public.stop_sharing(p_code text, p_member text)
returns void language sql security definer set search_path = public as $$
  delete from public.locations where code = p_code and member = p_member and length(p_code) >= 20;
$$;

revoke all on function public.share_location(text,text,double precision,double precision,real) from public;
revoke all on function public.get_locations(text) from public;
revoke all on function public.stop_sharing(text,text) from public;
grant execute on function public.share_location(text,text,double precision,double precision,real) to anon;
grant execute on function public.get_locations(text) to anon;
grant execute on function public.stop_sharing(text,text) to anon;`;

const SETUP_SQL_2=`create table if not exists public.group_data(
  code text not null check (length(code) >= 20),
  kind text not null check (kind in ('ride','person','rem','shop','shopx')),
  key text not null check (length(key) between 1 and 160),
  val text not null check (length(val) <= 4000),
  updated_at timestamptz not null default now(),
  primary key (code, kind, key)
);
alter table public.group_data enable row level security;
revoke all on public.group_data from anon, authenticated;

create or replace function public.gd_put(p_code text, p_kind text, p_key text, p_val text)
returns void language plpgsql security definer set search_path = public as $$
begin
  if length(p_code) < 20 then raise exception 'bad code'; end if;
  delete from public.group_data where updated_at < now() - interval '30 days';
  if (select count(*) from public.group_data where code = p_code) >= 3000
     and not exists (select 1 from public.group_data where code = p_code and kind = p_kind and key = p_key) then
    raise exception 'too many rows';
  end if;
  insert into public.group_data(code, kind, key, val, updated_at)
  values (p_code, p_kind, p_key, p_val, now())
  on conflict (code, kind, key) do update set val = excluded.val, updated_at = now();
end $$;

create or replace function public.gd_del(p_code text, p_kind text, p_key text)
returns void language sql security definer set search_path = public as $$
  delete from public.group_data where code = p_code and kind = p_kind and key = p_key and length(p_code) >= 20;
$$;

create or replace function public.gd_list(p_code text)
returns table(kind text, key text, val text, updated_at timestamptz)
language sql security definer set search_path = public stable as $$
  select kind, key, val, updated_at from public.group_data where code = p_code and length(p_code) >= 20;
$$;

revoke all on function public.gd_put(text,text,text,text) from public;
revoke all on function public.gd_del(text,text,text) from public;
revoke all on function public.gd_list(text) from public;
grant execute on function public.gd_put(text,text,text,text) to anon;
grant execute on function public.gd_del(text,text,text) to anon;
grant execute on function public.gd_list(text) to anon;`;

const waits=store.get("waits",{});   // {ak:{ts,list:[{n,x,t,s,w}]}, mk:{...}}
const werr={};
let wBusy=false;

async function getJSON(url){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),9000);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}
  finally{clearTimeout(t)}
}
async function loadPark(k){
  const P=PARKS[k];let j;
  try{j=await getJSON(API+"/entity/"+P.id+"/live")}
  catch(e){
    try{
      const d=await getJSON(API+"/destinations");
      const p=(d.destinations||[]).flatMap(x=>x.parks||[]).find(x=>P.re.test(x.name));
      if(!p)throw e;
      P.id=p.id;j=await getJSON(API+"/entity/"+p.id+"/live");
    }catch(e2){throw e}
  }
  return (j.liveData||[]).filter(e=>e.entityType==="ATTRACTION"||e.entityType==="SHOW").map(e=>({
    n:e.name,x:norm(e.name),t:e.entityType,s:e.status,
    w:e.queue&&e.queue.STANDBY&&e.queue.STANDBY.waitTime!=null?e.queue.STANDBY.waitTime:null
  }));
}
async function refreshWaits(){
  if(wBusy)return;wBusy=true;
  await Promise.all(Object.keys(PARKS).map(async k=>{
    try{waits[k]={ts:Date.now(),list:await loadPark(k)};delete werr[k]}
    catch(e){werr[k]=e&&e.name==="AbortError"?"The wait-time service timed out.":"Couldn’t reach the wait-time service. You may be offline, or the service may block browsers."}
  }));
  store.set("waits",waits);wBusy=false;paint();
  if(state.tab==="rides")$("#view").innerHTML=ridesHTML();
}
const fresh=k=>waits[k]&&Date.now()-waits[k].ts<15*60e3;
function entryFor(k,q){
  const w=waits[k];if(!w||!q)return null;
  for(const part of q.split("|")){const e=w.list.find(x=>x.x.includes(part));if(e)return e}
  return null;
}
function chip(e){
  if(!e)return null;
  if(e.s==="OPERATING"){
    if(e.w==null)return null;
    return {t:e.w+" min",c:e.w<=20?"w-low":e.w<=45?"w-mid":"w-high"};
  }
  return {t:({CLOSED:"Closed",DOWN:"Down",REFURBISHMENT:"Refurb"})[e.s]||String(e.s),c:"w-high"};
}
function paint(){
  document.querySelectorAll(".wt[data-q]").forEach(el=>{
    const k=el.dataset.p,c=fresh(k)?chip(entryFor(k,el.dataset.q)):null;
    el.className="wt"+(c?" on "+c.c:"");
    el.textContent=c?c.t:"";
  });
}
function wtSpan(k,q){return q?'<span class="wt" data-p="'+k+'" data-q="'+q+'"></span>':""}

/* ---------- group location sharing (Supabase) ---------- */
const G=store.get("grp",{});          // {u,k,code,me,share}
const gSave=()=>store.set("grp",G);
const gU=()=>G.u||CONFIG.SUPABASE_URL;
const gK=()=>G.k||CONFIG.SUPABASE_KEY;
const okUrl=u=>/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(u||"");
const rand=n=>{const a=new Uint8Array(n),A="abcdefghjkmnpqrstuvwxyz23456789";crypto.getRandomValues(a);return Array.from(a,b=>A[b%A.length]).join("")};
const who=m=>String(m).split("~")[0];
let watch=null,lastPos=null,lastSent=0,rows=[],gErr="",gStat="";

async function rpc(fn,body){
  const h={"Content-Type":"application/json",apikey:gK()};
  if(/^eyJ/.test(gK()))h.Authorization="Bearer "+gK();
  const r=await fetch(gU().replace(/\/$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers:h,body:JSON.stringify(body)});
  if(!r.ok)throw new Error(fn+" "+r.status);
  const t=await r.text();return t?JSON.parse(t):null;
}
function setStat(t){gStat=t;const e=$("#gstat");if(e)e.textContent=t}
async function send(){
  if(!lastPos||!G.code||!G.me)return;
  lastSent=Date.now();
  try{await rpc("share_location",{p_code:G.code,p_member:G.me,p_lat:lastPos.lat,p_lng:lastPos.lng,p_acc:lastPos.acc});setStat("Sharing. Last sent "+clock()+".");if(state.tab==="group"||state.tab==="map")refreshMembers()}
  catch(e){setStat("Couldn’t send your location. Will retry.")}
}
function onPos(p){
  lastPos={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)};
  if(Date.now()-lastSent>=15000)send();
  if(state.tab==="group")renderMembers();
}
function onGeoErr(e){
  if(e.code===1){setStat("Location is blocked. Allow it in your browser or phone settings, then try again.");stopShare();if(state.tab==="group")render()}
  else setStat("Still looking for a location fix.");
}
function startShare(){
  if(!navigator.geolocation){toast("This browser can’t share location");return}
  if(watch!=null)return;
  G.share=true;gSave();setStat("Waiting for a location fix...");
  watch=navigator.geolocation.watchPosition(onPos,onGeoErr,{enableHighAccuracy:true,maximumAge:10000,timeout:30000});
}
async function stopShare(){
  if(watch!=null){navigator.geolocation.clearWatch(watch);watch=null}
  G.share=false;gSave();setStat("Not sharing.");
  if(G.code&&G.me&&gU()&&gK()){try{await rpc("stop_sharing",{p_code:G.code,p_member:G.me})}catch(e){}}
}
// Keeps "last seen" fresh while you stand still. Stops by itself if the app is suspended.
setInterval(()=>{if(watch!=null&&lastPos&&Date.now()-lastSent>=30000)send()},10000);

async function refreshMembers(){
  if(!G.code||!gU()||!gK())return;
  try{rows=(await rpc("get_locations",{p_code:G.code}))||[];gErr=""}
  catch(e){gErr="Couldn’t reach the group. Check your signal."}
  renderMembers();
  if(state.tab==="map")drawMap();
}
function ago(iso){const s=Math.max(0,(Date.now()-new Date(iso))/1000);return s<45?"just now":s<3600?Math.round(s/60)+" min ago":Math.round(s/3600)+" h ago"}
const rad=x=>x*Math.PI/180;
function dist(a,b){const dl=rad(b.lat-a.lat),dg=rad(b.lng-a.lng),h=Math.sin(dl/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dg/2)**2;return 2*6371000*Math.asin(Math.sqrt(h))}
function bearing(a,b){const y=Math.sin(rad(b.lng-a.lng))*Math.cos(rad(b.lat)),x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lng-a.lng));return (Math.atan2(y,x)*180/Math.PI+360)%360}
const DIRS=["north","northeast","east","southeast","south","southwest","west","northwest"];
function fmtDist(m){const ft=m*3.28084;return ft<1000?Math.max(10,Math.round(ft/10)*10)+" ft":(m/1609.34).toFixed(1)+" mi"}
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
function mapLink(r){return isIOS?"https://maps.apple.com/?ll="+r.lat+","+r.lng+"&q="+encodeURIComponent(who(r.member)):"https://www.google.com/maps/search/?api=1&query="+r.lat+","+r.lng}
function renderMembers(){
  const el=$("#mem");if(!el)return;
  if(gErr&&!rows.length){el.innerHTML='<p class="err">'+gErr+'</p>';return}
  if(!rows.length){el.innerHTML='<p class="note">No one is sharing yet. Tap “Share my location”, and ask the others to do the same.</p>';return}
  const sorted=rows.slice().sort((a,b)=>who(a.member).localeCompare(who(b.member)));
  el.innerHTML=(gErr?'<p class="err">'+gErr+'</p>':"")+sorted.map(r=>{
    const mine=r.member===G.me,stale=Date.now()-new Date(r.updated_at)>5*60e3;
    let where="";
    if(!mine&&lastPos){const d=dist(lastPos,r);where=fmtDist(d)+" "+DIRS[Math.round(bearing(lastPos,r)/45)%8]+". "}
    return '<div class="mem'+(stale?" stale":"")+'"><b>'+esc(who(r.member))+(mine?" (you)":"")+'</b>'
      +'<div class="meta">'+where+(stale?"Last seen ":"Updated ")+ago(r.updated_at)+'</div>'
      +'<a href="'+mapLink(r)+'" target="_blank" rel="noopener">Open in Maps</a></div>';
  }).join("");
}
function inviteLink(){
  return location.origin+location.pathname+"#g="+G.code+"&u="+encodeURIComponent(gU())+"&k="+encodeURIComponent(gK())+(typeof tripParam==="function"&&tripParam()?"&"+tripParam():"");
}


/* ---------- trip setup and itinerary generator ---------- */
const THRILL_OK={gentle:e=>e.th<=1||!!e.kid,moderate:e=>e.th<=2,thrill:()=>true};
const THRILL_LABEL={gentle:"Gentle, for young children",moderate:"Moderate, coasters and spinners are fine",thrill:"Thrill, bring on the big drops"};
const STAY_LABEL={resort:"A Disney Resort hotel",partner:"A partner hotel or the Disney Springs area",near:"Off-site, near Disney (Kissimmee, Lake Buena Vista, Davenport)",far:"Off-site, farther away (International Drive, Orlando)"};
const STAY_MIN={resort:35,partner:40,near:60,far:75};
const TICKET_LABEL={base:"One park per day",hopper:"Park Hopper",hopperplus:"Park Hopper Plus"};
const LL_LABEL={none:"No Lightning Lane",multi:"Multi Pass",single:"Single Pass",multisingle:"Multi Pass and Single Pass",premier:"Premier Pass"};
const LL_WINDOW="Disney Resort hotel guests can book 7 days before check-in. Everyone else can book 3 days before the visit. Booking opens at 7:00 AM.";

let trip=store.get("trip",null);
let DAYS=[];

const P_=x=>x&&x.pos?{lat:x.pos[0],lng:x.pos[1]}:x;
const distP=(a,b)=>dist(P_(a),P_(b));
const walkMin=(a,b)=>Math.max(1,Math.round(distP(a,b)*PATH_FACTOR/WALK_MS/60));

function overlayNote(e,date){const o=OVERLAYS.find(o=>o.n===e.n&&inRange(date,o.from,o.to));return o?o.note:""}

// Why an attraction is left out of the plan for this trip, or "" if it can go in.
function whyNot(e,t,date){
  if(e.x)return e.x;
  if(date&&e.c&&inRange(date,e.c[0],e.c[1]))return e.c[2];
  if(date&&e.winter){const m=+date.slice(5,7);if(m>=1&&m<=4)return "Often closed for maintenance from January to April"}
  if(t.height&&e.h>t.height)return "Needs "+e.h+" in. Your shortest rider is "+t.height+" in.";
  if(!THRILL_OK[t.thrill||"moderate"](e))return "Too intense for your thrill setting";
  if(e.reserve)return e.reserve===1?(e.noauto||"Needs a reservation or an app queue, so it isn’t scheduled. Add it if you book it."):e.reserve;
  if(e.noauto)return e.noauto;
  if(e.t==="meet"&&!t.meets)return "Character meets are off in your setup";
  return "";
}
function candidates(pk,date,t){
  const ok=[],skips=[];
  CATALOG[pk].forEach(e=>{
    if(e.night||!e.pos)return;
    const r=whyNot(e,t,date);
    if(r)skips.push([e.n,r]);else ok.push(e);
  });
  return {ok,skips};
}

// Which rides are worth a Lightning Lane, given the pass bought.
function llTags(ok,t){
  const tags=new Map(),mode=t.ll||"none",rideOK=e=>e.t==="ride"&&e.pri<=2;
  if(mode==="premier"){ok.filter(e=>rideOK(e)||e.ll).forEach(e=>tags.set(e.id,"Premier Pass"));return tags}
  if(mode==="multi"||mode==="multisingle")
    ok.filter(e=>rideOK(e)&&e.ll!=="single").sort((a,b)=>b.dur-a.dur).slice(0,3).forEach(e=>tags.set(e.id,"Multi Pass"));
  if(mode==="single"||mode==="multisingle")
    ok.filter(e=>e.ll==="single"&&!tags.has(e.id)).sort((a,b)=>b.dur-a.dur).slice(0,2).forEach(e=>tags.set(e.id,"Single Pass"));
  return tags;
}

// Walking order helpers: nearest neighbor, then 2-opt to remove crossings.
function nnOrder(from,items){
  const rest=items.slice(),out=[];let cur=from;
  while(rest.length){
    let bi=0,bd=1e12;rest.forEach((e,i)=>{const d=distP(cur,e);if(d<bd){bd=d;bi=i}});
    const e=rest.splice(bi,1)[0];out.push(e);cur=e;
  }
  return out;
}
function pathLen(start,seq){let L=0,cur=start;seq.forEach(e=>{L+=distP(cur,e);cur=e});return L}
function twoOpt(start,seq){
  let best=seq.slice(),improved=true,guard=0;
  while(improved&&guard++<50){
    improved=false;
    for(let i=0;i<best.length-1;i++)for(let j=i+1;j<best.length;j++){
      const cand=best.slice(0,i).concat(best.slice(i,j+1).reverse(),best.slice(j+1));
      if(pathLen(start,cand)+1<pathLen(start,best)){best=cand;improved=true}
    }
  }
  return best;
}
function orOpt(start,seq){   // move one stop to a better spot until nothing improves
  let best=seq.slice(),improved=true,guard=0;
  while(improved&&guard++<50){
    improved=false;
    for(let i=0;i<best.length&&!improved;i++){
      const item=best[i],rest=best.slice(0,i).concat(best.slice(i+1));
      for(let j=0;j<=rest.length;j++){
        if(j===i)continue;
        const cand=rest.slice(0,j).concat([item],rest.slice(j));
        if(pathLen(start,cand)+1<pathLen(start,best)){best=cand;improved=true;break}
      }
    }
  }
  return best;
}
// The shortest walking order from a start point. Exact for up to 10 stops, a strong heuristic beyond that.
function bestOrder(start,seq){
  const n=seq.length;
  if(n<=1)return seq.slice();
  if(n>10)return orOpt(start,twoOpt(start,nnOrder(start,seq)));
  const pts=[start].concat(seq),D=pts.map(a=>pts.map(b=>distP(a,b)));
  let best=null,bl=nnLen(D,n)+1;
  const path=[];
  const rec=(used,len)=>{
    if(len>=bl)return;
    if(path.length===n){bl=len;best=path.slice();return}
    const last=path.length?path[path.length-1]:0;
    for(let i=1;i<=n;i++){if(used&(1<<i))continue;path.push(i);rec(used|(1<<i),len+D[last][i]);path.pop()}
  };
  rec(0,0);
  return best?best.map(i=>seq[i-1]):nnOrder(start,seq);
}
function nnLen(D,n){   // an upper bound to start pruning from
  const seen=new Set([0]);let cur=0,L=0;
  for(let k=0;k<n;k++){let bi=-1,bd=1e12;for(let i=1;i<=n;i++){if(!seen.has(i)&&D[cur][i]<bd){bd=D[cur][i];bi=i}}seen.add(bi);L+=bd;cur=bi}
  return L;
}

const VERB={ride:"Ride ",show:"Watch ",walk:"Walk ",meet:"Meet ",exp:"Visit "};
function mkItem(e,tag,date){
  const ov=overlayNote(e,date);
  const notes=[e.d,ov,tag?"Lightning Lane "+tag+". Book this one in the app.":""].filter(Boolean).join(" ");
  const verify=e.t==="show"||e.t==="meet";
  const extra=verify?(e.t==="show"?"Confirm showtimes in the app.":"Lineups rotate, so confirm in the app."):"";
  return {t:VERB[e.t]+e.n,k:e.t,f:verify?"verify":"",n:[notes,extra].filter(Boolean).join(" "),e,pk:e.p,tag:tag||"",w:[e.n,e.q],g:null,ck:1};
}

function buildPark(pk,date,t){
  const P=PARKS[pk],ov=(t.hours||{})[date]||{};
  const open=ov.open||P.open,close=ov.close||P.close;
  const openM=mins(open),closeM=mins(close);
  const resort=t.stay==="resort";
  const base=(t.travelMin!==""&&t.travelMin!=null&&!isNaN(+t.travelMin))?+t.travelMin:STAY_MIN[t.stay||"near"];
  const travel=base+(pk==="mk"&&!resort?15:0);        // Magic Kingdom adds a ferry or monorail hop for drivers
  const gateM=openM-(resort?45:30),leaveM=gateM-travel,t0=openM-(resort?30:0);
  const night=CATALOG[pk].find(e=>e.night);
  const nightOK=!!night&&closeM>=(pk==="ak"?19*60:19*60+30);
  const longDay=closeM-t0>=6*60;
  const breakAt=Math.max(t0+150,12*60+15);
  const reserve=nightOK?night.dur+25:15;
  const avail=(closeM-t0)-(longDay?60:0)-reserve-15;
  const {ok,skips}=candidates(pk,date,t);
  const tags=llTags(ok,t);
  const eff=e=>tags.has(e.id)?Math.min(e.dur,20):e.dur;
  const gate=P.gate;

  // 1. what fits: priority first, then the longest lines
  const chosen=[],left=[];let used=0;
  ok.slice().sort((a,b)=>a.pri-b.pri||b.dur-a.dur).forEach(e=>{const c=eff(e)+6;if(used+c<=avail){chosen.push(e);used+=c}else left.push(e)});

  // 2. rope drop: the two biggest rides without a Lightning Lane, close to each other
  const ropeC=chosen.filter(e=>e.pri===1&&e.t==="ride"&&!tags.has(e.id)).sort((a,b)=>b.dur-a.dur);
  let rope=[];
  if(ropeC.length){
    rope=[ropeC[0]];
    const near=ropeC.slice(1,4).filter(e=>distP(ropeC[0],e)<900).sort((a,b)=>distP(ropeC[0],a)-distP(ropeC[0],b))[0];
    if(near)rope.push(near);
    rope.sort((a,b)=>distP(gate,a)-distP(gate,b));
  }
  const rest=chosen.filter(e=>!rope.includes(e));
  const shows=rest.filter(e=>e.t==="show"),rides=rest.filter(e=>e.t!=="show");

  // 3. morning: nearest stop next, until the midday break
  const simRope=rope.reduce((c,e,i)=>c+walkMin(i?rope[i-1]:gate,e)+eff(e),0);
  let clockM=t0+simRope,pos=rope.length?rope[rope.length-1]:gate;
  const pool=rides.slice(),morning=[];
  while(pool.length&&(!longDay||clockM<breakAt)){
    let bi=0,bd=1e12;pool.forEach((e,i)=>{const d=distP(pos,e);if(d<bd){bd=d;bi=i}});
    const e=pool[bi],step=walkMin(pos,e)+eff(e);
    if(longDay&&clockM+step>breakAt+25)break;
    pool.splice(bi,1);morning.push(e);clockM+=step;pos=e;
  }
  const mStart=rope.length?rope[rope.length-1]:gate;
  const morningOpt=bestOrder(mStart,morning);
  const afterPos=morningOpt.length?morningOpt[morningOpt.length-1]:mStart;
  const afternoonOpt=bestOrder(afterPos,pool.concat(shows));

  // 4. final times
  let c=t0,cur=gate;const timed=[];
  const place=(e,seg)=>{const w=walkMin(cur,e);c+=w;const s=c;c+=eff(e);timed.push({e,seg,start:s,end:c,walk:w});cur=e};
  rope.forEach(e=>place(e,"rope"));
  morningOpt.forEach(e=>place(e,"am"));
  let breakStart=null;
  if(longDay){c=Math.max(c,breakAt);breakStart=c;c+=60}
  const dropped=[];
  afternoonOpt.forEach(e=>{
    if(c+walkMin(cur,e)+eff(e)<=closeM-reserve)place(e,"pm");else dropped.push(e);
  });
  let nightStart=null;
  if(nightOK){
    nightStart=Math.max(c,closeM-night.dur-15);
    if(nightStart+night.dur>closeM)nightStart=null;
  }
  const walkTotal=timed.reduce((a,x)=>a+x.walk,0);

  // 5. optional evening hop for Park Hopper tickets when the park closes early
  let hop=null;
  if(t.ticket!=="base"&&closeM<=19*60){
    const hp=pk==="ep"?"hs":"ep",HP=PARKS[hp],hopClose=mins(HP.close),hopArr=closeM+45;
    const hn=CATALOG[hp].find(e=>e.night);
    const hnOK=!!hn&&hopClose>=19*60+30;
    const hopAvail=(hopClose-hopArr)-(hnOK?hn.dur+25:15)-10;
    if(hopClose-hopArr>=90&&hopAvail>=45){
      const hc=candidates(hp,date,Object.assign({},t,{meets:false})).ok.filter(e=>e.t!=="walk").sort((a,b)=>a.pri-b.pri||b.dur-a.dur);
      const hchosen=[];let hu=0;
      hc.forEach(e=>{const cost=e.dur+6;if(hchosen.length<4&&hu+cost<=hopAvail){hchosen.push(e);hu+=cost}});
      const order=bestOrder(HP.gate,hchosen);
      let hcClock=hopArr,hcur=HP.gate;const ht=[];
      order.forEach(e=>{const w=walkMin(hcur,e);hcClock+=w;const s=hcClock;hcClock+=e.dur;ht.push({e,start:s,end:hcClock,walk:w});hcur=e});
      let hs=null;
      if(hnOK){hs=Math.max(hcClock,hopClose-hn.dur-15);if(hs+hn.dur>hopClose)hs=null}
      if(ht.length||hs!=null)hop={hp,HP,hopArr,ht,hn,hs,hopClose};
    }
  }

  // 6. blocks
  const blocks=[];
  blocks.push({s:hhmm(leaveM),e:hhmm(t0),h:"Getting there",items:[
    {t:"Leave "+(t.stayName||"your hotel")+" at "+fmt(hhmm(leaveM)),k:"go",f:"",n:"Allows about "+travel+" minutes from your door to the gate, including parking or transit. Change it in Trip setup if your trip is shorter or longer.",e:null,pk,tag:"",w:null,g:null,ck:0},
    {t:"Be at the gate by "+fmt(hhmm(gateM)),k:"",f:"",n:resort?"Disney Resort hotel guests can enter 30 minutes before the park opens at "+fmt(open)+". Your plan starts then.":"The park opens at "+fmt(open)+". Arriving 30 minutes early puts you at the front for your first ride.",e:null,pk,tag:"",w:null,g:null,ck:0}
  ]});
  const seg=(name,seg)=>{
    const xs=timed.filter(x=>x.seg===seg);
    if(!xs.length)return;
    blocks.push({s:hhmm(xs[0].start-xs[0].walk),e:hhmm(xs[xs.length-1].end),h:name,items:xs.map(x=>mkItem(x.e,tags.get(x.e.id),date))});
  };
  seg(rope.length>1?"At rope drop":"At rope drop","rope");
  seg("Morning","am");
  if(breakStart!=null)blocks.push({s:hhmm(breakStart),e:hhmm(breakStart+60),h:"Midday break",items:[
    {t:"Take an hour to rest, eat or just sit in the shade",k:"tip",f:"",n:"This keeps the afternoon from feeling like a slog. Move it earlier or later if your group needs it.",e:null,pk,tag:"",w:null,g:null,ck:0}
  ]});
  seg("Afternoon","pm");

    }
  }
  const closedToday=skips.filter(s=>{const e=CATALOG[pk].find(x=>x.n===s[0]);return e&&e.c&&inRange(date,e.c[0],e.c[1])}).map(s=>s[0]);
  if(closedToday.length)heads.push("Closed on this date: "+closedToday.join(", ")+".");
  if(hop)heads.push("Park Hopper: the plan adds an evening hop to "+hop.HP.label+" after "+PARKS[pk].label+" closes. You can hop to another park any time after 2:00 PM.");
  else if(t.ticket!=="base")heads.push("Park Hopper: you can switch parks any time after 2:00 PM if you want a second park today.");

  const why=[];
  if(rope.length)why.push("At rope drop: "+rope.map(e=>e.n).join(" then ")+". Lines are shortest in the first hour.");
  why.push("Stops are ordered to keep walking short. About "+walkTotal+" minutes of walking from the gate to the last stop, at stroller pace.");
  if(breakStart!=null)why.push("A one-hour break at "+fmt(hhmm(breakStart))+" so the afternoon doesn’t wear everyone out.");
  if(afternoonOpt.some(e=>e.t==="show"))why.push("Shows are in the afternoon, when you want a seat and some air-conditioning. Confirm showtimes in the app.");
  if(nightStart!=null)why.push("The day ends with "+night.n+".");

  const sk=skips.slice();

  if(notFit.length)sk.push(["Didn’t fit in the hours",notFit.join(", ")+". Swap one in if lines are short."]);

  return {
    id:"d"+date,kind:"park",date,dw:dowOf(date),dn:dnOf(date),short:P.short,cls:P.cls,pk,park:P.label,
    sub:"Rope drop at "+fmt(open)+(resort?", Early Entry at "+fmt(hhmm(t0)):""),
    hours:fmt(open)+" – "+fmt(close),hoursNote:ov.open||ov.close?"Hours you set.":"Typical hours. Confirm for your date.",
    open,close,heads,why,blocks,skips:sk,segs:hop?[pk,hop.hp]:[pk],walkTotal

// Which of the stay's days are park days. Arrival and departure days stay free when there's room.
function assignSlots(n,pd){
  const s=new Array(n).fill("rest");
  let first=0,last=n-1;
  if(pd<=n-2){s[0]="arrive";s[n-1]="depart";first=1;last=n-2}
  const avail=last-first+1,park=Math.min(pd,avail);
  const seq=[];
  if(park>=avail){for(let i=0;i<avail;i++)seq.push("park")}
  else{
    let restLeft=avail-park;const k=Math.ceil(park/(restLeft+1));
    for(let p=0;p<park;p++){seq.push("park");if((p+1)%k===0&&restLeft>0&&p<park-1){seq.push("rest");restLeft--}}
    while(seq.length<avail)seq.push("rest");
  }
  seq.forEach((v,i)=>{s[first+i]=v});
  return s;
}
function parkOrder(k){const b=["mk","ep","hs","ak"];return Array.from({length:k},(_,i)=>b[i%4])}

function generate(t){
  const out=[],n=t.nights+1,slots=assignSlots(n,t.parkDays),order=parkOrder(t.parkDays);
  let pi=0;
  for(let i=0;i<n;i++){
    const date=addDays(t.start,i);
    if(slots[i]==="park"){const pk=(t.park||{})[date]||order[pi];pi++;out.push(buildPark(pk,date,t))}
    else out.push(buildOther(slots[i],date,t));
  }
  return out;
}

// A trip can travel in a link, so friends open the same plan. Everything that arrives is validated.
function cleanTrip(o){
  if(!o||typeof o!=="object")return null;
  const start=String(o.start||"");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(start)||isNaN(new Date(start+"T12:00:00Z")))return null;
  const nights=Math.min(21,parseInt(o.nights,10)||0),pd=Math.min(nights+1,parseInt(o.parkDays,10)||0);
  if(nights<1||pd<1)return null;
  const pick=(v,obj,d)=>Object.prototype.hasOwnProperty.call(obj,v)?v:d;
  const tv=(o.travelMin===""||o.travelMin==null)?"":Math.min(240,Math.max(5,parseInt(o.travelMin,10)||0));
  const hours={},park={};
  Object.keys(o.hours||{}).slice(0,40).forEach(d=>{const h=o.hours[d];if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&h&&/^\d{2}:\d{2}$/.test(h.open)&&/^\d{2}:\d{2}$/.test(h.close)&&mins(h.close)>mins(h.open))hours[d]={open:h.open,close:h.close}});
  Object.keys(o.park||{}).slice(0,40).forEach(d=>{if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&Object.prototype.hasOwnProperty.call(PARKS,o.park[d]))park[d]=o.park[d]});
  const ht=parseInt(o.height,10);
  return {start,nights,parkDays:pd,ticket:pick(o.ticket,TICKET_LABEL,"base"),ll:pick(o.ll,LL_LABEL,"none"),stay:pick(o.stay,STAY_LABEL,"near"),
    stayName:String(o.stayName||"").slice(0,40),travelMin:tv||"",height:ht>=20&&ht<=80?ht:0,thrill:pick(o.thrill,THRILL_LABEL,"moderate"),meets:o.meets!==false,hours,park};
}

/* ---------- stops, numbering and walking ---------- */
const SN={};
function dayStops(day){
  const stops=[];
  day.blocks.forEach((b,bi)=>b.items.forEach((x,ii)=>{
    if(!x.e||!x.e.pos||x.k==="tip"||x.k==="go")return;
    stops.push({name:x.e.n,lat:x.e.pos[0],lng:x.e.pos[1],approx:!!x.e.pos[2],time:b.s,bi,ii,pk:x.pk||day.pk});
  }));
  return {stops};
}
function stopNums(day){
  if(!SN[day.id]){const m={};dayStops(day).stops.forEach((s,i)=>{m[s.bi+":"+s.ii]=i+1});SN[day.id]=m}
  return SN[day.id];
}
// walking to each stop in one park, starting at that park's entrance
function legsOf(pk,list){
  return list.map((s,i)=>{
    const from=i?list[i-1]:PARKS[pk].gate;
    const m=dist(from,s)*PATH_FACTOR;
    return {m,min:Math.max(1,Math.round(m/WALK_MS/60))};
  });
}
function segStops(day,pk){return dayStops(day).stops.map((s,i)=>Object.assign({n:i+1},s)).filter(s=>s.pk===pk)}
function paintWalk(){
  const el=$("#walkline");if(!el)return;
  const day=DAYS[state.day];
  if(!day||day.kind!=="park"){el.textContent="";return}
  let m=0,min=0,n=0;
  day.segs.forEach(pk=>{const st=segStops(day,pk),lg=legsOf(pk,st);st.forEach(()=>n++);lg.forEach(l=>{m+=l.m;min+=l.min})});
  el.textContent="Walking today: about "+min+" min ("+(m/1609.34).toFixed(1)+" mi) from the gate through "+n+" numbered stops. Straight-line estimate at stroller pace, so real paths run longer.";
}

const GD={rows:store.get("gd",{}),pend:{},dirty:store.get("gddirty",[]),avail:null,busy:false};   // rows: "kind|key" -> text
const gk=(kind,key)=>kind+"|"+key;
const grouped=()=>!!(G.code&&gU()&&gK());
const gdSave=()=>{store.set("gd",GD.rows);store.set("gddirty",GD.dirty)};
function gdGet(kind,key){return GD.rows[gk(kind,key)]}
function gdAll(kind){const p=kind+"|";return Object.keys(GD.rows).filter(a=>a.startsWith(p)).map(a=>({key:a.slice(p.length),val:GD.rows[a]}))}
function gdCall(op){
  return op.o==="put"?rpc("gd_put",{p_code:G.code,p_kind:op.kind,p_key:op.key,p_val:op.val}):rpc("gd_del",{p_code:G.code,p_kind:op.kind,p_key:op.key});
}
function gdQueue(op){GD.dirty=GD.dirty.filter(d=>!(d.kind===op.kind&&d.key===op.key));GD.dirty.push(op);gdSave()}
function gdSend(op){
  if(!grouped()||GD.avail===false)return;
  gdCall(op).then(()=>{GD.dirty=GD.dirty.filter(d=>!(d.kind===op.kind&&d.key===op.key));gdSave()})
    .catch(e=>{if(/ 404/.test(String(e&&e.message)))GD.avail=false;gdQueue(op)});
}
function gdSet(kind,key,val){const a=gk(kind,key);GD.rows[a]=val;GD.pend[a]=Date.now();gdSave();gdSend({o:"put",kind,key,val})}
function gdDel(kind,key){const a=gk(kind,key);delete GD.rows[a];GD.pend[a]=Date.now();gdSave();gdSend({o:"del",kind,key})}

function softRender(){
  const ae=document.activeElement;

async function gdSync(){
  if(!grouped()||GD.busy)return;
  GD.busy=true;const was=GD.avail;let changed=false;
  try{
    if(G.gdFor!==G.code){   // first time in this group: share what's already on this phone
      for(const a of Object.keys(GD.rows)){const i=a.indexOf("|");await rpc("gd_put",{p_code:G.code,p_kind:a.slice(0,i),p_key:a.slice(i+1),p_val:GD.rows[a]})}
      G.gdFor=G.code;gSave();
    }
    for(const op of GD.dirty.slice()){await gdCall(op);GD.dirty=GD.dirty.filter(d=>!(d.kind===op.kind&&d.key===op.key))}
    const list=(await rpc("gd_list",{p_code:G.code}))||[];
    const next={};list.forEach(r=>{next[gk(r.kind,r.key)]=r.val});
    const now=Date.now();
    Object.keys(GD.pend).forEach(a=>{   // keep very recent local edits until the server catches up
      if(now-GD.pend[a]<5000){if(a in GD.rows)next[a]=GD.rows[a];else delete next[a]}else delete GD.pend[a];
    });
    changed=JSON.stringify(next)!==JSON.stringify(GD.rows);
    GD.rows=next;GD.avail=true;gdSave();
  }catch(e){
    if(/ 404/.test(String(e&&e.message)))GD.avail=false;   // the setup SQL hasn't been run yet
  }finally{GD.busy=false}
  if(changed||was!==GD.avail)softRender();
}

  return "";
}

function syncPeople(){
  if(G.me&&ppl.length===1&&ppl[0]==="Me"){ppl=[who(G.me)];store.set("people",ppl)}
  ppl.forEach(n=>{
    const k=pKey(n);let v={};try{v=JSON.parse(gdGet("person",k)||"{}")}catch(e){}
    if(v.o!==ownerId()||v.n!==n)gdSet("person",k,JSON.stringify({n,o:ownerId()}));

function addPerson(raw){
  const n=String(raw||"").replace(/\s+/g," ").trim().slice(0,20);
  if(!n)return "Type a name first";
  const k=pKey(n);
  if(ppl.some(x=>pKey(x)===k))return n+" is already on this phone";
  let v={};try{v=JSON.parse(gdGet("person",k)||"{}")}catch(e){}
  if(v.o&&v.o!=="local"&&v.o!==ownerId())return "Someone else in the group already uses “"+n+"”. Add an initial, like “"+n+" S.”";
  ppl.push(n);store.set("people",ppl);syncPeople();return "";
}
function removePerson(n){

/* ---------- plan ---------- */
function pickDay(){
  const today=nowET().date;
  let i=DAYS.findIndex(d=>d.date===today&&d.kind==="park");
  if(i>=0)return i;
  i=DAYS.findIndex(d=>d.date>today&&d.kind==="park");
  if(i>=0)return i;
  i=DAYS.findIndex(d=>d.kind==="park");
  return i>=0?i:0;
}
function tripRange(){
  const s=DAYS[0].date,e=DAYS[DAYS.length-1].date;
  return s.slice(0,7)===e.slice(0,7)?monthDay(s)+"–"+dnOf(e):monthDay(s)+" – "+monthDay(e);
}
function countdown(){
  if(!DAYS.length)return "";
  const today=nowET().date,n=dayNum(DAYS[0].date)-dayNum(today),last=dayNum(DAYS[DAYS.length-1].date)-dayNum(today);
  if(n>1)return n+" days to go";
  if(n===1)return "Tomorrow";
  if(last>=0)return DAYS.some(d=>d.date===today)?"Trip day (Orlando time)":"Between days";
  return "Trip complete";
}

/* ---------- rides ---------- */
const TYPE_LABEL={ride:"Ride",show:"Show",walk:"Walk",meet:"Meet",exp:"Experience"};
const FILTERS={all:["All",null],ride:["Rides",["ride"]],meet:["Meets",["meet","exp"]],show:["Shows and walks",["show","walk"]]};
function tripWhy(e){
  if(e.x)return {closed:e.x};
  const dates=DAYS.filter(d=>d.kind==="park").map(d=>d.date);
  if(e.c){const hit=dates.filter(d=>inRange(d,e.c[0],e.c[1])).length;
    if(hit&&hit===dates.length)return {closed:"Closed on your dates. "+e.c[2]};
    if(hit)return {closed:"Closed on some of your dates. "+e.c[2]}}
  const r=whyNot(Object.assign({},e,{c:null,winter:false}),trip,null);
  return r?{skip:r}:{};
}
function catRow(e,plan){
  const w=tripWhy(e),c=w.closed?null:chip(entryFor(e.p,e.q));
  const badges=(e.h?'<span class="badge b-h">'+e.h+' in</span>':(e.x?"":'<span class="badge b-h">Any height</span>'))
    +(plan.has(e.id)?'<span class="badge b-added">On your plan</span>':"")
    +(w.skip?'<span class="badge b-removed">Skipped for you</span>':"")
    +(w.closed?'<span class="badge b-removed">Closed</span>':"");
  const note=[w.closed||w.skip||"",e.d].filter(Boolean).join(" ");
  return '<li class="wrow"><span><b>'+esc(e.n)+'</b>'+badges+'<small>'+TYPE_LABEL[e.t]+(note?". "+esc(note.trim()):"")+'</small>'+(w.closed||e.x?"":ckHTML(e.id))+'</span>'
    +(c?'<span class="wt on '+c.c+'">'+c.t+'</span>':"")+'</li>';
}
function ridesHTML(){
  const k=PARKS[state.wp]?state.wp:((DAYS[state.day]&&DAYS[state.day].pk)||"mk");
  const P=PARKS[k],w=waits[k],cf=state.cf||"all",want=FILTERS[cf][1];
  let h='<section class="sec"><h1>Rides and meets</h1>'+gdNotice()+'<p>Everything at the park, with live standby waits from ThemeParks.wiki. Tap a name under a ride when that person has done it. Waits are estimates and they move fast. Character lineups rotate, so confirm in My Disney Experience.</p>'
    +'<div class="seg4">'+Object.keys(PARKS).map(x=>'<button type="button" class="btn" data-act="wpark" data-p="'+x+'" aria-pressed="'+(x===k)+'">'+PARKS[x].label+'</button>').join("")+'</div>'
    +'<div class="chips">'+Object.keys(FILTERS).map(f=>'<button type="button" class="chipbtn" data-act="cfilter" data-f="'+f+'" aria-pressed="'+(f===cf)+'">'+FILTERS[f][0]+'</button>').join("")+'</div>'
    +'<div class="btns"><button type="button" class="btn" data-act="wrefresh">Refresh waits</button></div>';
  if(werr[k])h+='<p class="err">'+werr[k]+(w?" Showing the last numbers from "+clock(w.ts)+".":"")+'</p>';
  else if(!w)h+='<p class="note">Loading waits...</p>';
  if(w){const old=Date.now()-w.ts>15*60e3;h+='<p class="stat">'+(old?"These numbers are old. Last updated ":"Waits updated ")+clock(w.ts)+', Orlando time.</p>'}
  const sum=checkinSummary();if(sum)h+='<p class="stat">Check-ins so far: '+sum+'.</p>';
  h+='</section>'+peopleHTML();
  const plan=planIds(),list=CATALOG[k].filter(e=>!want||want.includes(e.t));
  const isClosed=e=>!!tripWhy(e).closed;
  const open=list.filter(e=>!isClosed(e)),closed=list.filter(isClosed),lands=[];
  open.forEach(e=>{let g=lands.find(x=>x.l===e.l);if(!g){g={l:e.l,items:[]};lands.push(g)}g.items.push(e)});
  lands.forEach(g=>{h+='<section class="sec"><h2>'+esc(g.l)+'</h2><ul class="catlist" style="list-style:none;padding:0;margin:0">'+g.items.map(e=>catRow(e,plan)).join("")+'</ul></section>'});
  if(closed.length)h+='<section class="sec"><h2>Not available on your dates</h2><ul class="catlist" style="list-style:none;padding:0;margin:0">'+closed.map(e=>catRow(e,plan)).join("")+'</ul></section>';
  if(!list.length)h+='<p class="note">Nothing in this filter.</p>';
  return h;
}

function rulesHTML(){
  return '<section class="sec"><h2>Park rules</h2><p>Check Disney’s site before you pack.</p>'
    +'<ul class="rows">'+RULES.map(r=>'<li><b>'+r[0]+'</b><span>'+r[1]+'</span></li>').join("")+'</ul></section>'
    +'<section class="sec"><h2>Put it on your phone</h2><p>Open the link once with signal. After that the plan works offline. Waits and the group need a connection.</p>'
    +'<ol class="how"><li><b>iPhone:</b> open the link in Safari, tap Share, then Add to Home Screen.</li>'
    +'<li><b>Android:</b> open the link in Chrome, tap the menu, then Install app or Add to Home screen.</li></ol>'
    +'<p class="fine">Check marks on the plan are saved on each phone separately.</p></section>';
}
function notesHTML(){
  return '<section class="sec"><h1>Notes</h1><p>Your reminders and notes come first, and you can edit them. The sections further down are for reference.</p></section>'
    +remindersHTML()
    +'<section class="sec"><h2>Your trip</h2>'+tripSummary()+'<div class="btns"><button type="button" class="btn" data-act="setup">Change trip setup</button></div></section>'
    +'<section class="sec"><h2>Check in My Disney Experience</h2><ul class="rows chk">'
    +CHECKS.map((x,i)=>'<li><label><input type="checkbox" data-k="chk:'+i+'"'+(done["chk:"+i]?" checked":"")+'><span>'+esc(x)+'</span></label></li>').join("")+'</ul></section>'
    +rulesHTML()
    +'<p class="fine">Fan-made, not affiliated with Disney. Disney and attraction names belong to their owners and are used only to describe the parks. Park facts checked '+KNOWLEDGE+'. Heights, closures and hours change, so confirm before you go. Positions marked ≈ are estimated from the park layout. Wait times: ThemeParks.wiki.</p>';
}

/* ---------- render ---------- */
function render(){
  if(!trip||!DAYS.length){showSetup(true);return}
  if(state.day>=DAYS.length)state.day=0;
  const day=DAYS[state.day];
  document.body.className=day.cls;
  $("#brand").textContent="Disney World, "+tripRange();
  $("#days").innerHTML=DAYS.map((d,i)=>'<button type="button" class="day-btn '+d.cls+'" data-day="'+i+'" aria-pressed="'+(i===state.day)+'">'
    +'<span class="dw">'+d.dw+'</span><span class="dn">'+d.dn+'</span><span class="dp">'+esc(d.short)+'</span></button>').join("");
  const act=document.querySelector(".day-btn[aria-pressed=true]"),box=$("#days");   // keep the chosen day in view
  if(act&&box.offsetWidth){const r=act.getBoundingClientRect(),bb=box.getBoundingClientRect();box.scrollLeft+=r.left-bb.left-(bb.width-r.width)/2}
  document.querySelectorAll(".tab").forEach(b=>{if(b.dataset.tab===state.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  $("#days").style.display=state.tab==="plan"||state.tab==="map"?"":"none";
  if(state.tab!=="map"&&mapObj){mapObj.remove();mapObj=null;mapLayer=null}
  const view={plan:planHTML,map:mapHTML,rides:ridesHTML,group:groupHTML,notes:notesHTML}[state.tab]||planHTML;
  $("#view").innerHTML=view();
  $("#view").insertAdjacentHTML("beforeend",'<p class="sig">Created by Avinash</p>');
  $("#count").textContent=countdown();
  paint();
  if(state.tab==="plan")paintWalk();
  if(state.tab==="map"){initMap();if(G.code&&gU()&&gK())refreshMembers()}
  if(state.tab==="group"){renderMembers();refreshMembers()}
  if(state.tab==="rides"){const k=PARKS[state.wp]?state.wp:day.pk||"mk";if(!waits[k]||Date.now()-waits[k].ts>60e3)refreshWaits()}
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");
  if(a){
    const act=a.dataset.act;
    if(act==="setup")showSetup(false);
    else if(act==="setupsave")saveSetup();
    else if(act==="setupcancel")hideSetup();
    else if(act==="dayapply"){
      const day=DAYS[state.day],np=$("#de_p").value,o=$("#de_o").value,c=$("#de_c").value;
      if(!o||!c||mins(c)<=mins(o))return toast("Closing time should be after opening time");
      trip.park=trip.park||{};trip.hours=trip.hours||{};
      if(np!==day.pk){trip.park[day.date]=np;delete trip.hours[day.date]}
      else if(o===PARKS[np].open&&c===PARKS[np].close)delete trip.hours[day.date];
      else trip.hours[day.date]={open:o,close:c};
      store.set("trip",trip);regen();Object.keys(SN).forEach(k=>delete SN[k]);state.seg=0;render();toast("Day rebuilt");
    }
    else if(act==="dayreset"){
      const day=DAYS[state.day];trip.park=trip.park||{};trip.hours=trip.hours||{};
      delete trip.park[day.date];delete trip.hours[day.date];
      store.set("trip",trip);regen();Object.keys(SN).forEach(k=>delete SN[k]);state.seg=0;render();toast("Day reset");
    }
    else if(act==="mseg"){state.seg=+a.dataset.i;render()}
    else if(act==="wpark"){state.wp=a.dataset.p;render()}
    else if(act==="wrefresh"){toast("Refreshing");refreshWaits()}
    else if(act==="cfilter"){state.cf=a.dataset.f;render()}
    else if(act==="gorides"){state.wp=DAYS[state.day].pk;state.cf="all";state.tab="rides";store.set("tab","rides");render();window.scrollTo(0,0)}
    else if(act==="radd"){
      const t=($("#rt").value||"").trim();if(!t)return toast("Type something first");
      remPut({id:rand(8),t:t.slice(0,200),due:$("#rd").value||"",done:false});render();toast("Added");
    }
    else if(act==="redit"){state.editRem=a.dataset.id;render()}
    else if(act==="rcancel"){state.editRem=null;render()}
    else if(act==="rsave"){
      const r=remList().find(x=>x.id===a.dataset.id),t=($("#re_t").value||"").trim();
      if(!r)return;if(!t)return toast("It can’t be empty");
      r.t=t.slice(0,200);r.due=$("#re_d").value||"";state.editRem=null;remPut(r);render();
    }
    else if(act==="rdel"){gdDel("rem",a.dataset.id);render()}
    else if(act==="rdone"){const r=remList().find(x=>x.id===a.dataset.id);if(r){r.done=true;remPut(r);render()}}
    else if(act==="ck"){
      const key=a.dataset.rk+"~"+a.dataset.p,y=window.scrollY;
      if(gdGet("ride",key)!==undefined)gdDel("ride",key);else gdSet("ride",key,"1");
      render();window.scrollTo(0,y);
    }
    else if(act==="padd"){const err=addPerson($("#pn").value);if(err)return toast(err);state.pplOpen=true;render();toast("Added")}
    else if(act==="prem"){const err=removePerson(a.dataset.n);if(err)return toast(err);state.pplOpen=true;render()}
    else if(act==="gpeople"){state.pplOpen=true;state.wp=DAYS[state.day].pk;state.cf="all";state.tab="rides";store.set("tab","rides");render();window.scrollTo(0,0)}
    else if(act==="mfit"){const day=DAYS[state.day],st=segStops(day,curSeg(day));if(mapObj&&st.length)mapObj.fitBounds(L.latLngBounds(st.map(s=>[s.lat,s.lng])),{padding:[30,30],maxZoom:17})}
    else if(act==="mlocate"){
      if(!navigator.geolocation)return toast("This browser can’t read location");
      navigator.geolocation.getCurrentPosition(p=>{lastPos={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)};drawMap();if(mapObj)mapObj.setView([lastPos.lat,lastPos.lng],Math.max(mapObj.getZoom(),17))},()=>toast("Location is blocked"),{enableHighAccuracy:true,timeout:15000});
    }
    else if(act==="gsql"){navigator.clipboard.writeText(SETUP_SQL_ALL).then(()=>toast("SQL copied"),()=>toast("Couldn’t copy. Open “Show the SQL” and copy it by hand."))}
    else if(act==="gsave"){
      const u=($("#gu").value||"").trim().replace(/\/$/,""),k=($("#gk").value||"").trim();
      if(!okUrl(u))return toast("The URL should look like https://abcd.supabase.co");
      if(k.length<20||/service_role/i.test(k))return toast("Paste the publishable key, not a secret key");
      G.u=u;G.k=k;gSave();render();
    }
    else if(act==="gstart"){G.code=rand(24);gSave();render();gdSync()}
    else if(act==="gname"){
      const n=($("#gn").value||"").replace(/~/g," ").trim().slice(0,24);
      if(!n)return toast("Enter your name");
      G.me=n+"~"+rand(3);gSave();syncPeople();gdSync();render();
    }
    else if(act==="gshare"){if(watch==null)startShare();else stopShare();render()}
    else if(act==="gdist"){
      if(!navigator.geolocation)return toast("This browser can’t read location");
      navigator.geolocation.getCurrentPosition(p=>{lastPos={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)};render()},()=>toast("Location is blocked"),{enableHighAccuracy:true,timeout:15000});
    }
    else if(act==="ginvite")shareLink("Join our Disney trip group","Open this to see the plan and the group map.",inviteLink());
    else if(act==="gleave"){
      if(!confirm("Leave the group? You’ll stop sharing and need a new invite to rejoin."))return;
      stopShare().then(()=>{G.code=null;G.me=null;rows=[];gSave();render()});
    }
    return;
  }
  const d=e.target.closest("[data-day]");
  if(d){state.day=+d.dataset.day;state.seg=0;if(state.tab!=="map")state.tab="plan";render();window.scrollTo(0,0);return}
  const t=e.target.closest("[data-tab]");
  if(t){state.tab=t.dataset.tab;store.set("tab",state.tab);render();window.scrollTo(0,0);return}
});
document.addEventListener("input",e=>{if(e.target.id==="memo"){memo=e.target.value;store.set("memo",memo)}});
document.addEventListener("change",e=>{
  const d=e.target.dataset||{};
  if(d.r){const r=remList().find(x=>x.id===d.r);if(r){r.done=e.target.checked;remPut(r);render()}return}
  const k=d.k;
  if(!k)return;
  if(e.target.checked)done[k]=1;else delete done[k];
  store.set("pdone",done);
});
document.addEventListener("toggle",e=>{const k=e.target.dataset&&e.target.dataset.s;if(k)state[k]=e.target.open},true);
$("#share").addEventListener("click",()=>shareLink("Disney World trip plan","Our Disney World plan. Open it to see the same itinerary.",tripLink()));
$("#setupbtn").addEventListener("click",()=>showSetup(!trip));

/* ---------- start ---------- */
(function joinFromLink(){
  if(!location.hash)return;
  const p=new URLSearchParams(location.hash.slice(1)),g=p.get("g"),tj=p.get("t");
  let used=false;
  if(tj&&!trip){   // adopt the host's trip only on a phone that hasn't set one up
    try{const ct=cleanTrip(JSON.parse(tj));if(ct){trip=ct;store.set("trip",trip);used=true}}catch(e){}
  }
  if(g&&/^[a-z0-9]{20,64}$/i.test(g)){
    if(G.code&&G.code!==g){G.me=null;G.share=false}
    G.code=g;
    const uu=p.get("u"),k=p.get("k");
    if(okUrl(uu))G.u=uu.replace(/\/$/,"");        // only *.supabase.co is accepted
    if(k&&/^[\w.\-]{20,600}$/.test(k)&&!/service_role/i.test(k))G.k=k;
    gSave();state.tab="group";used=true;
  }
  if(used||g||tj)history.replaceState(null,"",location.pathname+location.search);
})();
regen();
state.day=pickDay();
render();
const nowEl=$("#now");
if(nowEl&&state.tab==="plan")nowEl.scrollIntoView({block:"center"});
refreshWaits();
if(grouped()){syncPeople();gdSync()}
if(G.share&&G.code&&G.me&&gU()&&gK())startShare();
setInterval(()=>{
  if(document.hidden||!trip)return;
  if(state.tab==="plan"){
    const open=document.activeElement&&(document.activeElement.tagName==="INPUT"||document.activeElement.tagName==="SELECT");
    if(!open){const y=window.scrollY;render();window.scrollTo(0,y)}
  }
},60000);
setInterval(()=>{if(!document.hidden&&trip&&(state.tab==="rides"||state.tab==="plan"))refreshWaits()},120000);
setInterval(()=>{if(!document.hidden&&(state.tab==="group"||(state.tab==="map"&&G.code&&gU()&&gK())))refreshMembers()},15000);
setInterval(()=>{if(!document.hidden)gdSync()},15000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){gdSync();const k=DAYS[state.day]&&DAYS[state.day].pk;if(k&&(!waits[k]||Date.now()-waits[k].ts>60e3))refreshWaits()}});
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(()=>{});

</script>
</body>
</html>
